<title>Domänhoppet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen arcade cabinet. Slim top bar, a tall portrait playfield centered, overlays inside the playfield. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #0a0c18;
  --deep: #151a33;
  --panel: #1b2142;
  --ink: #f4f4f8;
  --muted: #a9b1d0;
  --red: #e2242c;
  --red-hi: #f94e52;
  --aqua: #40cccd;
  --font-display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  max-width: 480px;
  margin-inline: auto;
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand i { font-style: normal; color: var(--red-hi); }
.bar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.best { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.best b { color: var(--ink); font-weight: 700; }
.chip-btn {
  font: inherit; font-size: 13px; font-weight: 700;
  color: var(--ink); background: var(--panel);
  border: 1.5px solid rgba(64, 204, 205, 0.45);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip-btn:hover { border-color: var(--aqua); }
[hidden] { display: none !important; }
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 480px;
  margin-inline: auto;
  border-radius: 18px;
  overflow: hidden;
  background: var(--deep);
  box-shadow: 0 0 0 1.5px rgba(64, 204, 205, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center;
  background: linear-gradient(180deg, rgba(10, 12, 24, 0.55), rgba(10, 12, 24, 0.86));
}
.overlay h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(34px, 9vw, 46px); line-height: 1.02; letter-spacing: -0.02em;
  margin: 0; text-wrap: balance;
}
.overlay h1 i { font-style: normal; color: var(--red-hi); }
.overlay p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 30ch; }
.overlay p b { color: var(--ink); font-weight: 700; }
.play {
  font-family: var(--font-display); font-weight: 800; font-size: 20px;
  color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--red));
  border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer;
  box-shadow: 0 8px 26px rgba(226, 36, 44, 0.45);
}
.play:hover { filter: brightness(1.08); }
.play:active { transform: translateY(1px); }
.keys { font-size: 13px; color: var(--muted); }
.result { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 26px; margin-block: 4px; }
.result div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.result span { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--aqua); font-weight: 700; }
.result strong { font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.newbest { color: var(--aqua); font-weight: 700; font-size: 14px; }
</style>

<div class="bar">
  <div class="brand">Domän<i>hoppet</i></div>
  <div class="bar-right">
    <div class="best">Rekord <b id="best">0</b></div>
    <button class="chip-btn" id="sound" type="button" aria-pressed="true">Ljud på</button>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="Spelplan"></canvas>

  <div class="overlay" id="startScreen">
    <h1>Domän<i>hoppet</i></h1>
    <p>Studsa uppåt mellan domänändelserna. <b>Varje ny ändelse du samlar höjer multiplikatorn.</b> Missar du en plattform ramlar du ner.</p>
    <button class="play" id="startBtn" type="button">Spela</button>
    <div class="keys">Styr med piltangenterna, eller håll på vänster eller höger halva av spelplanen.</div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <h1>Du <i>ramlade!</i></h1>
    <div class="result">
      <div><span>Poäng</span><strong id="rScore">0</strong></div>
      <div><span>Ändelser</span><strong id="rTlds">0</strong></div>
      <div><span>Multiplikator</span><strong id="rMult">×1</strong></div>
    </div>
    <div class="newbest" id="newBest" hidden>Nytt rekord!</div>
    <button class="play" id="againBtn" type="button">Spela igen</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TLDS = ['.se', '.nu', '.com', '.net', '.org', '.io', '.eu', '.ai', '.dev', '.app', '.shop', '.tech', '.info', '.co', '.me', '.online'];
  var VW = 400;                       // logical playfield width
  var GRAV = 1900, JUMP = 840, BOOST = 1250, SPEED = 340, PR = 22, PH = 28;
  var RED = '#e2242c', RED_HI = '#f94e52', RED_LO = '#b00e18', AQUA = '#40cccd', INK = '#f4f4f8';

  var canvas = document.getElementById('game');
  var stage = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var startScreen = document.getElementById('startScreen');
  var overScreen = document.getElementById('overScreen');
  var bestEl = document.getElementById('best');
  var soundBtn = document.getElementById('sound');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var scale = 1, VH = 640, dpr = 1;
  var state = 'start';                // start | play | over
  var player, plats, parts, pops, stars, camY, topY, score, mult, collected, rounds, tGame, shake, banner;
  var input = { left: false, right: false, pl: false, pr: false };
  var best = 0, soundOn = true, actx = null;

  try { best = parseInt(localStorage.getItem('domanhoppet.best') || '0', 10) || 0; } catch (e) { best = 0; }
  try { soundOn = localStorage.getItem('domanhoppet.sound') !== 'off'; } catch (e) { soundOn = true; }
  bestEl.textContent = best;
  syncSoundBtn();

  function syncSoundBtn() {
    soundBtn.textContent = soundOn ? 'Ljud på' : 'Ljud av';
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }

  // ---------------------------------------------------------------- sound
  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { actx = new AC(); } catch (e) { actx = null; } }
    }
    if (actx && actx.state === 'suspended') { actx.resume().catch(function () {}); }
    return actx;
  }
  function blip(f0, f1, dur, type, vol, delay) {
    if (!soundOn) return;
    var a = audio(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  function sndBounce() { blip(300, 620, 0.12, 'square', 0.05); }
  function sndNew(n) {
    var f = 523.25 * Math.pow(2, SCALE[n % SCALE.length] / 12);
    blip(f, f, 0.09, 'square', 0.07); blip(f * 1.5, f * 1.5, 0.16, 'square', 0.07, 0.07);
  }
  function sndBoost() { blip(260, 1400, 0.3, 'sawtooth', 0.06); }
  function sndBreak() { blip(500, 120, 0.18, 'triangle', 0.09); }
  function sndFull() { [0, 4, 7, 12, 16].forEach(function (s, i) { blip(523.25 * Math.pow(2, s / 12), 523.25 * Math.pow(2, s / 12), 0.2, 'square', 0.07, i * 0.08); }); }
  function sndFall() { blip(520, 60, 0.7, 'sawtooth', 0.07); }

  // ---------------------------------------------------------------- setup
  function resize() {
    var r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    scale = r.width / VW;
    VH = r.height / scale;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function measure(label) { ctx.font = '700 18px Poppins, sans-serif'; return Math.max(64, ctx.measureText(label).width + 40); }

  function pickTld() {
    var missing = TLDS.filter(function (t) { return !collected[t]; });
    if (missing.length && Math.random() < 0.6) return missing[Math.floor(Math.random() * missing.length)];
    return TLDS[Math.floor(Math.random() * TLDS.length)];
  }
  function addPlat(y, forceX, forceTld) {
    var h = -y;
    var tld = forceTld || pickTld();
    var w = measure(tld);
    var kind = 'normal', r = Math.random();
    if (!forceTld) {
      var pBreak = Math.min(0.24, h / 14000), pMove = Math.min(0.34, h / 9000);
      if (r < 0.06) kind = 'boost';
      else if (r < 0.06 + pBreak) kind = 'break';
      else if (r < 0.06 + pBreak + pMove) kind = 'move';
    }
    plats.push({
      x: forceX != null ? forceX : rnd(8, VW - w - 8), y: y, w: w, tld: tld, kind: kind,
      vx: kind === 'move' ? (Math.random() < 0.5 ? -1 : 1) * rnd(50, 110 + Math.min(90, h / 120)) : 0,
      visited: false, gone: false, bump: 0, flash: 0
    });
  }
  function fill() {
    while (topY > camY - 140) {
      var h = -topY;
      var gap = rnd(58, Math.min(150, 86 + h / 70));
      topY -= gap;
      addPlat(topY);
    }
  }
  function reset() {
    plats = []; parts = []; pops = [];
    collected = {}; rounds = 0; score = 0; mult = 1; tGame = 0; shake = 0; banner = null;
    camY = 0;
    var startY = VH - 70;
    player = { x: VW / 2, y: startY - PR, vx: 0, vy: -JUMP, sq: 0, look: 0, maxUp: 0 };
    var w = measure('.com');
    addPlat(startY, VW / 2 - w / 2, '.com');
    topY = startY;
    fill();
    stars = [];
    for (var i = 0; i < 46; i++) stars.push({ x: Math.random() * VW, y: Math.random() * 1200, r: rnd(0.6, 2.2), d: rnd(0.08, 0.3), aq: Math.random() < 0.3 });
  }

  // ---------------------------------------------------------------- update
  function land(p) {
    player.y = p.y - PR;
    player.sq = 1;
    p.bump = 1;
    var gain = 0;
    if (!p.visited) {
      p.visited = true;
      var isNew = !collected[p.tld];
      if (isNew) {
        collected[p.tld] = true;
        mult += 1;
        sndNew(Object.keys(collected).length - 1);
      } else {
        sndBounce();
      }
      gain = 10 * mult;
      score += gain;
      p.flash = 1;
      pops.push({ x: p.x + p.w / 2, y: p.y - 30, t: 0, txt: '+' + gain, big: isNew, sub: isNew ? 'Ny ändelse ' + p.tld : '' });
      burst(p.x + p.w / 2, p.y, isNew ? 14 : 6);
      if (Object.keys(collected).length === TLDS.length) {
        rounds += 1;
        score += 1000 * rounds;
        collected = {};
        banner = { t: 0, txt: 'Full portfölj!  +' + (1000 * rounds) };
        sndFull();
      }
    } else {
      sndBounce();
    }
    if (p.kind === 'boost') { player.vy = -BOOST; sndBoost(); burst(p.x + p.w / 2, p.y, 18); }
    else player.vy = -JUMP;
    if (p.kind === 'break') { p.gone = true; sndBreak(); burst(p.x + p.w / 2, p.y + 10, 12); }
  }
  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = rnd(Math.PI, Math.PI * 2);
      var s = rnd(60, 260);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.35, 0.7), r: rnd(2, 4.5), c: i % 3 === 0 ? AQUA : (i % 3 === 1 ? RED_HI : '#ffffff') });
    }
  }
  function update(dt) {
    tGame += dt;
    var dir = (input.right || input.pr ? 1 : 0) - (input.left || input.pl ? 1 : 0);
    player.vx += (dir * SPEED - player.vx) * Math.min(1, dt * 14);
    player.look += (dir - player.look) * Math.min(1, dt * 10);
    var prevBottom = player.y + PR;
    player.vy += GRAV * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    if (player.x < -PR) player.x += VW + 2 * PR;
    if (player.x > VW + PR) player.x -= VW + 2 * PR;
    player.sq = Math.max(0, player.sq - dt * 5);

    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (p.vx) {
        p.x += p.vx * dt;
        if (p.x < 6) { p.x = 6; p.vx = Math.abs(p.vx); }
        if (p.x + p.w > VW - 6) { p.x = VW - 6 - p.w; p.vx = -Math.abs(p.vx); }
      }
      p.bump = Math.max(0, p.bump - dt * 4);
      p.flash = Math.max(0, p.flash - dt * 3);
      if (p.gone) continue;
      if (player.vy > 0 && prevBottom <= p.y + 1 && player.y + PR >= p.y &&
          player.x > p.x - PR * 0.55 && player.x < p.x + p.w + PR * 0.55) {
        land(p);
      }
    }
    // camera follows upward only
    var target = player.y - VH * 0.42;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 9);
    fill();
    plats = plats.filter(function (p) { return p.y - camY < VH + 80 && !(p.gone && p.bump <= 0); });

    parts.forEach(function (q) { q.t += dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; });
    parts = parts.filter(function (q) { return q.t < q.life; });
    pops.forEach(function (q) { q.t += dt; });
    pops = pops.filter(function (q) { return q.t < 1.1; });
    if (banner) { banner.t += dt; if (banner.t > 2.2) banner = null; }

    if (player.y - camY > VH + 70) gameOver();
  }
  function gameOver() {
    state = 'over';
    sndFall();
    var n = Object.keys(collected).length + rounds * TLDS.length;
    document.getElementById('rScore').textContent = score;
    document.getElementById('rTlds').textContent = n;
    document.getElementById('rMult').textContent = '×' + mult;
    var isBest = score > best;
    if (isBest) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('domanhoppet.best', String(best)); } catch (e) {}
    }
    document.getElementById('newBest').hidden = !isBest;
    overScreen.hidden = false;
    document.getElementById('againBtn').focus();
  }

  // ---------------------------------------------------------------- draw
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawBg(now) {
    var g = ctx.createRadialGradient(VW / 2, VH * 0.55, 10, VW / 2, VH * 0.55, VH * 0.85);
    g.addColorStop(0, '#2a3158'); g.addColorStop(0.55, '#141831'); g.addColorStop(1, '#080912');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var y = ((s.y - camY * s.d) % 1200 + 1200) % 1200;
      if (y > VH) continue;
      var tw = reduceMotion ? 0.8 : 0.6 + 0.4 * Math.sin(now / 900 + i);
      ctx.globalAlpha = 0.5 * tw;
      ctx.fillStyle = s.aq ? AQUA : '#c8d2ff';
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawPlat(p, now) {
    var y = p.y - camY + Math.sin(p.bump * Math.PI) * 7;
    var a = p.gone ? p.bump : 1;
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    if (p.visited && p.kind !== 'boost') {
      var g = ctx.createLinearGradient(0, y, 0, y + PH);
      g.addColorStop(0, RED_HI); g.addColorStop(1, RED_LO);
      ctx.shadowColor = 'rgba(249,78,82,0.55)'; ctx.shadowBlur = 14;
      rr(p.x, y, p.w, PH, 11); ctx.fillStyle = g; ctx.fill();
      ctx.shadowBlur = 0;
    } else if (p.kind === 'boost') {
      var gb = ctx.createLinearGradient(0, y, 0, y + PH);
      gb.addColorStop(0, '#7fe9ea'); gb.addColorStop(1, '#1f9c9d');
      ctx.shadowColor = 'rgba(64,204,205,0.7)'; ctx.shadowBlur = 16;
      rr(p.x, y, p.w, PH, 11); ctx.fillStyle = gb; ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      rr(p.x, y, p.w, PH, 11); ctx.fillStyle = '#181d38'; ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = p.kind === 'break' ? 'rgba(244,244,248,0.75)' : AQUA;
      if (p.kind === 'break') ctx.setLineDash([6, 5]);
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (p.flash > 0) { rr(p.x, y, p.w, PH, 11); ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * p.flash) + ')'; ctx.fill(); }
    ctx.font = '700 18px Poppins, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.kind === 'boost' ? '#06282a' : INK;
    var label = p.tld;
    ctx.fillText(label, p.x + p.w / 2, y + PH / 2 + 1);
    if (p.kind === 'boost') {            // little up-arrows mark the spring platform
      ctx.fillStyle = '#06282a';
      for (var k = -1; k <= 1; k += 2) {
        var ax = p.x + p.w / 2 + k * (p.w / 2 - 13);
        ctx.beginPath(); ctx.moveTo(ax, y + 8); ctx.lineTo(ax + 5, y + 16); ctx.lineTo(ax - 5, y + 16); ctx.closePath(); ctx.fill();
      }
    }
    if (p.kind === 'move' && !p.visited) {
      ctx.fillStyle = AQUA; ctx.globalAlpha = a * 0.8;
      ctx.beginPath(); ctx.arc(p.x + 9, y + PH / 2, 2.2, 0, 6.283); ctx.arc(p.x + p.w - 9, y + PH / 2, 2.2, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  function drawPlayer(px, py) {
    var stretch = Math.max(-0.16, Math.min(0.16, -player.vy / 5200));
    var sy = 1 + stretch - 0.28 * Math.sin(player.sq * Math.PI) * player.sq;
    var sx = 1 / Math.sqrt(Math.max(0.5, sy));
    ctx.save();
    ctx.translate(px, py + PR * (1 - sy));
    // glow
    var gl = ctx.createRadialGradient(0, 0, PR * 0.8, 0, 0, PR * 2.1);
    gl.addColorStop(0, 'rgba(249,78,82,0.35)'); gl.addColorStop(1, 'rgba(249,78,82,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, PR * 2.1, 0, 6.283); ctx.fill();
    ctx.scale(sx, sy);
    var g = ctx.createRadialGradient(-PR * 0.38, -PR * 0.42, 1, -PR * 0.38, -PR * 0.42, PR * 1.75);
    g.addColorStop(0, RED_HI); g.addColorStop(0.42, RED); g.addColorStop(1, RED_LO);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, PR, 0, 6.283); ctx.fill();
    // face
    var lx = player.look, ly = Math.max(-1, Math.min(1, player.vy / 900));
    var fx = lx * PR * 0.13, fy = ly * PR * 0.07;
    for (var s = -1; s <= 1; s += 2) {
      var ex = s * PR * 0.29 + fx, ey = -PR * 0.13 + fy;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, PR * 0.165, PR * 0.21, 0, 0, 6.283); ctx.fill();
      var ppx = ex + lx * PR * 0.07, ppy = ey + PR * 0.015 + ly * PR * 0.08;
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ppx, ppy, PR * 0.088, 0, 6.283); ctx.fill();
      ctx.strokeStyle = AQUA; ctx.lineWidth = PR * 0.03; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ppx - PR * 0.008, ppy - PR * 0.01, PR * 0.045, Math.PI * 1.0, Math.PI * 1.5); ctx.stroke();
      ctx.strokeStyle = '#111'; ctx.lineWidth = PR * 0.04;
      ctx.beginPath(); ctx.moveTo(s * PR * 0.43 + fx, -PR * 0.46 + fy); ctx.quadraticCurveTo(s * PR * 0.33 + fx, -PR * 0.57 + fy, s * PR * 0.17 + fx, -PR * 0.53 + fy); ctx.stroke();
    }
    ctx.strokeStyle = '#111'; ctx.lineWidth = PR * 0.045; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx - PR * 0.2, PR * 0.15 + fy); ctx.quadraticCurveTo(fx, PR * 0.36 + fy, fx + PR * 0.2, PR * 0.15 + fy); ctx.stroke();
    ctx.restore();
  }
  function pill(x, y, label, value, alignRight) {
    ctx.font = '700 11px Poppins, sans-serif';
    var wl = ctx.measureText(label).width;
    ctx.font = '800 16px Poppins, sans-serif';
    var wv = ctx.measureText(value).width;
    var w = wl + wv + 30;
    var x0 = alignRight ? x - w : x;
    rr(x0, y, w, 30, 15); ctx.fillStyle = 'rgba(10,12,26,0.78)'; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(64,204,205,0.55)'; ctx.stroke();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '700 11px Poppins, sans-serif'; ctx.fillStyle = AQUA; ctx.fillText(label, x0 + 12, y + 16);
    ctx.font = '800 16px Poppins, sans-serif'; ctx.fillStyle = INK; ctx.fillText(value, x0 + 18 + wl, y + 16);
    return w;
  }
  function drawHud() {
    var n = Object.keys(collected).length;
    var w = pill(10, 10, 'POÄNG', String(score), false);
    pill(10 + w + 6, 10, 'MULT', '×' + mult, false);
    pill(VW - 10, 10, 'ÄNDELSER', n + '/' + TLDS.length, true);
    // collection strip: one tick per ending
    var tw = (VW - 20 - (TLDS.length - 1) * 3) / TLDS.length;
    for (var i = 0; i < TLDS.length; i++) {
      rr(10 + i * (tw + 3), 46, tw, 5, 2.5);
      ctx.fillStyle = collected[TLDS[i]] ? RED_HI : 'rgba(244,244,248,0.16)';
      ctx.fill();
    }
  }
  function draw(now) {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    drawBg(now);
    for (var i = 0; i < plats.length; i++) drawPlat(plats[i], now);
    for (i = 0; i < parts.length; i++) {
      var q = parts[i];
      ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y - camY, q.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var py = player.y - camY;
    drawPlayer(player.x, py);
    if (player.x < PR) drawPlayer(player.x + VW + 2 * PR, py);
    if (player.x > VW - PR) drawPlayer(player.x - VW - 2 * PR, py);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < pops.length; i++) {
      var o = pops[i], u = o.t / 1.1;
      ctx.globalAlpha = 1 - u * u * u;
      ctx.font = '800 ' + (o.big ? 22 : 16) + 'px Poppins, sans-serif';
      ctx.fillStyle = o.big ? AQUA : INK;
      var ox = Math.max(60, Math.min(VW - 60, o.x));
      ctx.fillText(o.txt, ox, o.y - camY - 40 * (1 - Math.pow(1 - u, 3)));
      if (o.sub) { ctx.font = '700 12px Poppins, sans-serif'; ctx.fillStyle = INK; ctx.fillText(o.sub, ox, o.y - camY - 40 * (1 - Math.pow(1 - u, 3)) + 20); }
    }
    ctx.globalAlpha = 1;
    if (state !== 'start') drawHud();
    if (banner) {
      var b = banner.t, al = Math.min(1, b * 5) * Math.min(1, (2.2 - b) * 3);
      ctx.globalAlpha = al;
      rr(30, VH * 0.3 - 30, VW - 60, 60, 30); ctx.fillStyle = 'rgba(10,12,26,0.85)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = AQUA; ctx.stroke();
      ctx.font = '800 20px Poppins, sans-serif'; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(banner.txt, VW / 2, VH * 0.3 + 1);
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------- loop
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000 || 0);
    last = now;
    if (state === 'play') {
      update(dt);
    } else if (state === 'start') {
      // attract mode: the mascot bounces on the start platform
      player.vy += GRAV * dt; player.y += player.vy * dt; player.sq = Math.max(0, player.sq - dt * 5);
      var p0 = plats[0];
      if (player.vy > 0 && player.y + PR >= p0.y) { player.y = p0.y - PR; player.vy = -JUMP * 0.7; player.sq = 1; p0.bump = 1; }
      p0.bump = Math.max(0, p0.bump - dt * 4);
    }
    draw(now);
    requestAnimationFrame(frame);
  }
  function start() {
    audio();
    reset();
    state = 'play';
    startScreen.hidden = true; overScreen.hidden = true;
    canvas.focus({ preventScroll: true });
    sndBoost();
  }

  // ---------------------------------------------------------------- input
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { input.left = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { input.right = true; e.preventDefault(); }
    else if ((e.key === ' ' || e.key === 'Enter') && state !== 'play' && e.target.tagName !== 'BUTTON') { start(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
  });
  function pointerSide(e) {
    var r = canvas.getBoundingClientRect();
    var right = e.clientX - r.left > r.width / 2;
    input.pl = !right; input.pr = right;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pointerSide(e); e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) { if (input.pl || input.pr) pointerSide(e); });
  function pointerEnd() { input.pl = false; input.pr = false; }
  canvas.addEventListener('pointerup', pointerEnd);
  canvas.addEventListener('pointercancel', pointerEnd);
  window.addEventListener('blur', function () { input.left = input.right = input.pl = input.pr = false; });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn; syncSoundBtn();
    try { localStorage.setItem('domanhoppet.sound', soundOn ? 'on' : 'off'); } catch (e) {}
    if (soundOn) { audio(); sndBounce(); }
  });

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();
  reset();
  player.vy = 0;
  requestAnimationFrame(frame);
})();
</script>
